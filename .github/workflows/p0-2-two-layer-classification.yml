name: P0-2 two-layer classification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-result-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: No-go theorem/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r 'No-go theorem/requirements.txt'
      - name: Validate classifier and frozen 240-point result
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python 'Writing Paper/pra/tests/test_p0_2_two_layer_classification.py'

  full-recomputation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: No-go theorem/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r 'No-go theorem/requirements.txt'
      - name: Recompute full P0-2 grid
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python 'Writing Paper/pra/src/p0_2_two_layer_classification.py' --jobs 2
      - name: Run P0-2 regression checks
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python 'Writing Paper/pra/tests/test_p0_2_two_layer_classification.py'
      - name: Upload P0-2 outputs
        uses: actions/upload-artifact@v4
        with:
          name: p0-2-two-layer-results
          path: |
            Writing Paper/pra/results/tables/p0_2_two_layer_phase_diagram.csv
            Writing Paper/pra/results/tables/p0_2_two_layer_summary.json
            Writing Paper/pra/results/tables/p0_2_two_layer_phase_diagram.npz
            Writing Paper/pra/results/figures/fig_p0_2_two_layer_phase_diagram.png
            Writing Paper/pra/results/figures/fig_p0_2_two_layer_phase_diagram.pdf
          if-no-files-found: error
